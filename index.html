<style>
:root{
    --toolbar-height:60px;
    --bg-color:#121212;
    --panel-color:#1e1e1e;
    --accent:#00bcd4;
    --text:#e0e0e0;
}

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:0;
    background:var(--bg-color);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
}

body.chrome-minimized .bottom-nav,
body.chrome-minimized .panel,
body.chrome-minimized .fab{
    opacity:0;
    pointer-events:none;
    transform:translateY(20px);
}

body.chrome-minimized .panel{
    transform:translateY(110%);
}

body.chrome-minimized .quick-open{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
}

/* CANVAS AREA */
#canvas-container{
    position:relative;
    flex-grow:1;
    width:100%;
    overflow:hidden;
    touch-action:none;
    background:#2a2a2a;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    display:block;
    z-index:3;
    background:white;
}

#shapeCanvas{
    z-index:4;
    pointer-events:none;
    background:transparent;
}

#canvas-bg,
#cameraFeed,
#traceImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#canvas-bg{
    z-index:0;
    background-color:white;
}

#cameraFeed{
    z-index:1;
    object-fit:cover;
    display:none;
    background:#000;
}

#traceImage{
    z-index:2;
    object-fit:contain;
    opacity:.45;
    display:none;
    pointer-events:none;
}

/* TOP BAR */
.top-bar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50px;
    z-index:100;
    background:rgba(30,30,30,.95);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    backdrop-filter:blur(10px);
    border-bottom:1px solid #333;
    transition:opacity .2s ease, transform .2s ease;
}

.logo{
    font-weight:800;
    font-size:1.1rem;
    color:var(--accent);
    letter-spacing:1px;
}

.guide-controls{
    position:absolute;
    top:56px;
    left:50%;
    z-index:105;
    display:none;
    align-items:center;
    gap:10px;
    width:min(360px,calc(100% - 28px));
    min-height:44px;
    padding:8px 12px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:8px;
    background:rgba(30,30,30,.9);
    backdrop-filter:blur(10px);
    transform:translateX(-50%);
}

.guide-controls.active{
    display:flex;
}

.guide-controls label{
    min-width:auto;
    white-space:nowrap;
}

.guide-controls span{
    min-width:42px;
    text-align:right;
    color:#aaa;
    font-size:.8rem;
}

.guide-import{
    width:34px;
    height:34px;
    flex:0 0 auto;
    border:none;
    border-radius:50%;
    background:#333;
    color:var(--text);
    cursor:pointer;
}

.guide-import:active{
    background:var(--accent);
    color:white;
}

.camera-help{
    position:absolute;
    top:106px;
    left:50%;
    z-index:106;
    display:none;
    width:min(380px,calc(100% - 28px));
    padding:12px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:8px;
    background:rgba(30,30,30,.94);
    color:var(--text);
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    transform:translateX(-50%);
}

.camera-help.active{
    display:block;
}

.camera-help p{
    margin:0 0 10px;
    color:#ddd;
    font-size:.86rem;
    line-height:1.35;
}

.camera-help-actions{
    display:flex;
    gap:8px;
}

.camera-help-actions button{
    flex:1;
    min-height:38px;
    border:none;
    border-radius:8px;
    background:#333;
    color:var(--text);
    cursor:pointer;
}

.camera-help-actions button:first-child{
    background:var(--accent);
    color:white;
}

.collab-panel{
    position:absolute;
    top:56px;
    right:12px;
    z-index:130;
    display:none;
    width:min(330px,calc(100% - 24px));
    padding:14px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:8px;
    background:rgba(30,30,30,.96);
    box-shadow:0 8px 18px rgba(0,0,0,.38);
    backdrop-filter:blur(10px);
}

.collab-panel.active{
    display:block;
}

.collab-panel h3{
    margin:0 0 12px;
}

.collab-status{
    min-height:20px;
    margin-bottom:10px;
    color:#aaa;
    font-size:.82rem;
}

.collab-code{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
    background:#111;
    color:white;
    font-weight:800;
    letter-spacing:2px;
}

.collab-code.active{
    display:flex;
}

.collab-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.collab-row input{
    min-width:0;
    flex:1;
    min-height:40px;
    border:1px solid #444;
    border-radius:8px;
    background:#111;
    color:var(--text);
    padding:0 10px;
    text-transform:uppercase;
    outline:none;
}

.collab-panel button{
    min-height:40px;
    border:none;
    border-radius:8px;
    background:#333;
    color:var(--text);
    cursor:pointer;
    padding:0 12px;
}

.collab-panel button.primary{
    background:var(--accent);
    color:white;
}

.collab-panel button.danger{
    background:#4a2424;
    color:#ffb3b3;
}

.collab-float{
    position:absolute;
    top:62px;
    right:14px;
    z-index:125;
    display:none;
    align-items:center;
    gap:8px;
    min-height:42px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    background:rgba(30,30,30,.92);
    color:var(--text);
    padding:0 12px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
}

.collab-float.active{
    display:flex;
}

.collab-float i{
    color:var(--accent);
}

.collab-float span{
    font-size:.78rem;
    font-weight:700;
}

@media (max-width:420px){
    .logo{
        font-size:.95rem;
    }

    .top-bar{
        padding:0 8px;
    }
}

.btn-icon{
    background:none;
    border:none;
    color:var(--text);
    font-size:1.1rem;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
}

.btn-icon:active{
    background:#333;
}

/* FAB */
.fab{
    position:absolute;
    bottom:80px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    z-index:90;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    transition:opacity .2s ease, transform .2s ease;
}

.quick-open{
    position:absolute;
    right:14px;
    bottom:14px;
    display:flex;
    gap:10px;
    z-index:110;
    opacity:0;
    pointer-events:none;
    transform:translateY(12px);
    transition:opacity .2s ease, transform .2s ease;
}

.quick-open button{
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:50%;
    background:rgba(30,30,30,.88);
    color:var(--text);
    font-size:1.1rem;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
}

.quick-open button:active{
    background:var(--accent);
    color:white;
}

/* BOTTOM NAV */
.bottom-nav{
    position:absolute;
    bottom:0;
    width:100%;
    height:var(--toolbar-height);
    background:var(--panel-color);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
    border-top:1px solid #333;
    transition:opacity .2s ease, transform .2s ease;
}

.nav-item{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:.65rem;
    color:#888;
    cursor:pointer;
}

.nav-item.active{
    color:var(--accent);
    background:rgba(0,188,212,.1);
}

.nav-item i{
    font-size:1.3rem;
    margin-bottom:4px;
}

/* PANELS */
.panel{
    position:absolute;
    bottom:var(--toolbar-height);
    left:0;
    width:100%;
    max-height:60vh;
    overflow-y:auto;
    z-index:90;

    background:var(--panel-color);
    border-radius:20px 20px 0 0;
    border-top:1px solid #444;

    padding:20px;

    transform:translateY(110%);
    transition:
        opacity .2s ease,
        transform .3s cubic-bezier(.4,0,.2,1);
}

.panel.active{
    transform:translateY(0);
}

h3{
    margin:0 0 15px;
    font-size:1rem;
    color:#aaa;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:15px;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.panel-header h3{
    margin:0;
    border:0;
    padding:0;
}

.panel-close{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:#333;
    color:var(--text);
    font-size:1rem;
    cursor:pointer;
}

.panel-close:active{
    background:var(--accent);
    color:white;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.flex-grow{
    flex-grow:1;
}

label{
    min-width:60px;
    color:#888;
    font-size:.8rem;
}

/* RANGE */
input[type="range"]{
    width:100%;
    height:6px;
    border-radius:3px;
    background:#444;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
}

input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--accent);
}

/* PALETTE */
.palette-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    padding-bottom:15px;
}

.color-swatch{
    width:100%;
    padding-top:100%;
    border-radius:50%;
    position:relative;
    cursor:pointer;
}

.color-swatch::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.3);
}

.color-swatch.selected{
    transform:scale(1.15);
    border:2px solid white;
}

/* TOOLS */
.tools-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.shape-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.shape-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:96px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:#1f1f1f;
    color:var(--text);
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
}

.shape-card:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
    background:rgba(0,188,212,.08);
}

.shape-card i{
    font-size:1.6rem;
    color:var(--accent);
}

.shape-card span{
    font-size:.92rem;
}

.tool-btn{
    background:#333;
    border:none;
    border-radius:10px;
    padding:15px 0;
    color:#888;
    font-size:1.2rem;
    cursor:pointer;
}

.tool-btn.active{
    background:var(--accent);
    color:white;
}

.mode-btn{
    background:#333;
    border:none;
    border-radius:8px;
    color:#888;
    cursor:pointer;
    flex:1;
    min-height:42px;
    font-size:.9rem;
}

.mode-btn.active{
    background:var(--accent);
    color:white;
}

.wide-btn{
    width:100%;
    color:white;
}

.hidden-input{
    display:none;
}

/* LAYERS */
.layer-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#333;
    padding:12px;
    border-radius:8px;
    margin-bottom:8px;
    border-left:4px solid transparent;
}

.layer-item.active{
    border-left-color:var(--accent);
    background:#3a3a3a;
}

.layer-actions i{
    padding:8px;
    cursor:pointer;
    color:#888;
}

/* TOAST */
.toast{
    position:fixed;
    top:60px;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    max-width:calc(100% - 28px);
    background:#333;
    color:white;
    padding:10px 20px;
    border-radius:25px;
    font-size:.9rem;
    text-align:center;
    white-space:normal;
    opacity:0;
    transition:.3s;
    pointer-events:none;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* COLOR PICKER */
input[type="color"]{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    padding:0;
}

input[type="color"]::-webkit-color-swatch-wrapper{
    padding:0;
}

input[type="color"]::-webkit-color-swatch{
    border:none;
    border-radius:50%;
    border:2px solid #555;
}

select{
    min-height:38px;
    border:none;
    border-radius:8px;
    background:#333;
    color:var(--text);
    padding:0 10px;
    outline:none;
}
</style>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="logo">MobiDraw</div>

    <div>
        <button
            class="btn-icon"
            title="Share canvas"
            aria-label="Share canvas"
            onclick="app.toggleCollabPanel()">
            <i class="fas fa-user-group"></i>
        </button>

        <button class="btn-icon" onclick="app.undo()">
            <i class="fas fa-undo"></i>
        </button>

        <button class="btn-icon" onclick="app.redo()">
            <i class="fas fa-redo"></i>
        </button>

        <button class="btn-icon" onclick="app.exportPNG()">
            <i class="fas fa-download"></i>
        </button>

        <button class="btn-icon" onclick="app.saveProject()">
            <i class="fas fa-cloud"></i>
        </button>
    </div>
</div>

<div id="collabPanel" class="collab-panel">
    <h3>Share Canvas</h3>

    <div id="collabStatus" class="collab-status">
        Create a code or join a friend.
    </div>

    <div id="collabCodeBox" class="collab-code">
        <span id="collabCodeText"></span>

        <button onclick="app.copyCollabCode()">
            Copy
        </button>
    </div>

    <div class="collab-row">
        <button
            class="primary"
            onclick="app.createShareCode()">
            Create Code
        </button>

        <button
            class="danger"
            onclick="app.disconnectCollab()">
            Stop
        </button>
    </div>

    <div class="collab-row">
        <input
            id="joinCodeInput"
            type="text"
            maxlength="6"
            placeholder="CODE"
            autocomplete="off"
        />

        <button
            class="primary"
            onclick="app.joinShareCode()">
            Join
        </button>
    </div>
</div>

<button
    id="collabFloat"
    class="collab-float"
    onclick="app.openCollabPanel()">
    <i class="fas fa-user-group"></i>
    <span>Connected</span>
</button>

<div id="guideControls" class="guide-controls">
    <button
        class="guide-import"
        title="Import guide image"
        aria-label="Import guide image"
        onclick="app.openImageImporter()">
        <i class="fas fa-image"></i>
    </button>

    <label for="guideIntensity">Guide</label>
    <input
        id="guideIntensity"
        class="flex-grow"
        type="range"
        min="0"
        max="100"
        value="45"
        oninput="app.setGuideIntensity(this.value)"
    />
    <span id="guideIntensityLabel">45%</span>
</div>

<div id="cameraHelp" class="camera-help" role="status">
    <p id="cameraHelpText"></p>

    <div class="camera-help-actions">
        <button onclick="app.setMode('camera')">
            Retry
        </button>

        <button onclick="app.hideCameraHelp()">
            Close
        </button>
    </div>
</div>

<!-- CANVAS -->
<div id="canvas-container">
    <div id="canvas-bg"></div>
    <video
        id="cameraFeed"
        autoplay
        playsinline
        muted>
    </video>
    <img id="traceImage" alt="" />
    <canvas id="mainCanvas"></canvas>
    <canvas id="shapeCanvas"></canvas>
</div>

<input
    type="file"
    id="imageImporter"
    class="hidden-input"
    accept="image/*"
    onchange="app.importImage(this.files[0])"
/>

<!-- FAB -->
<button class="fab" onclick="app.togglePanel('layers')">
    <i class="fas fa-layer-group"></i>
</button>

<!-- QUICK OPEN -->
<div class="quick-open">
    <button
        title="Colors"
        aria-label="Open colors"
        onclick="app.togglePanel('color')">
        <i class="fas fa-palette"></i>
    </button>

    <button
        title="Tools"
        aria-label="Open tools"
        onclick="app.togglePanel('tools')">
        <i class="fas fa-pen-nib"></i>
    </button>
</div>

<!-- NAV -->
<div class="bottom-nav">

    <div class="nav-item" onclick="app.togglePanel('color')">
        <i class="fas fa-palette"></i>
        <span>Color</span>
    </div>

    <div class="nav-item active" onclick="app.togglePanel('tools')">
        <i class="fas fa-pen-nib"></i>
        <span>Tools</span>
    </div>

</div>

<!-- COLOR PANEL -->
<div id="panel-color" class="panel">

    <div class="panel-header">
        <h3>Palette</h3>

        <button
            class="panel-close"
            title="Close colors"
            aria-label="Close colors"
            onclick="app.closePanels()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="palette-grid" id="colorGrid"></div>

    <h3>Custom</h3>

    <div class="row">
        <input
            type="color"
            id="customColorPicker"
            onchange="app.setColor(this.value)"
        />

        <span
        class="flex-grow"
        style="font-size:.8rem;color:#888;margin-left:10px;">
            Pick any color
        </span>
    </div>

</div>

<!-- TOOLS PANEL -->
<div id="panel-tools" class="panel active">

    <div class="panel-header">
        <h3>Tools</h3>

        <button
            class="panel-close"
            title="Close tools"
            aria-label="Close tools"
            onclick="app.closePanels()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <h3>Brush Size</h3>

    <div class="row">
        <label id="sizeLabel">5px</label>

        <input
            type="range"
            class="flex-grow"
            min="1"
            max="50"
            value="5"
            oninput="app.setBrushSize(this.value)"
        />
    </div>

    <h3>Opacity</h3>

    <div class="row">

<div class="toast" id="toast"></div>

<script>

class MobiDraw{

    constructor(){

        this.canvas = document.getElementById('mainCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.cameraFeed = document.getElementById('cameraFeed');
        this.traceImage = document.getElementById('traceImage');
        this.imageImporter =
            document.getElementById('imageImporter');
        this.guideControls =
            document.getElementById('guideControls');
        this.cameraHelp =
            document.getElementById('cameraHelp');
        this.cameraHelpText =
            document.getElementById('cameraHelpText');
        this.collabPanel =
            document.getElementById('collabPanel');
        this.collabStatus =
            document.getElementById('collabStatus');
        this.collabCodeBox =
            document.getElementById('collabCodeBox');
        this.collabCodeText =
            document.getElementById('collabCodeText');
        this.joinCodeInput =
            document.getElementById('joinCodeInput');
        this.collabFloat =
            document.getElementById('collabFloat');

        this.shapeCanvas =
            document.getElementById('shapeCanvas');

        this.container =
            document.getElementById('canvas-container');

        this.isDrawing = false;

        this.lastX = 0;
        this.lastY = 0;

        this.startX = 0;
        this.startY = 0;
        this.shapeSnapshot = null;

        this.currentTool = 'brush';

        this.brushSize = 5;
        this.shapeSize = 100;

        this.currentColor = '#000000';

        this.shapeCtx = null;
        this.shapes = [];
        this.lines = [];
        this.currentLine = null;
        this.selectedShape = null;
        this.dragOffset = {x:0,y:0};
        this.shapeSize = 100;

        this.opacity = 1;
        this.blendMode = 'source-over';
        this.mode = 'draw';
        this.cameraStream = null;
        this.isStartingCamera = false;

        this.history = [];
        this.historyStep = -1;

        this.maxHistory = 20;
        this.lastCanvasTap = 0;

        this.peer = null;
        this.connections = [];
        this.shareCode = '';
        this.clientId =
            Math.random().toString(36).slice(2);
        this.isApplyingRemote = false;

        this.layers = [
            {
                id:1,
                name:'Background'
            },
            {
                id:2,
                name:'Layer 1'
            }
        ];

        this.activeLayerId = 2;

        this.init();
    }

    init(){

        this.resize();

        window.addEventListener(
            'resize',
            () => this.resize()
        );

        window.addEventListener(
            'keydown',
            e => {
                if(e.key === 'Escape'){
                    this.restoreChrome();
                }
            }
        );

        this.ctx.clearRect(
            0,
            0,
            this.canvas.width,
            this.canvas.height
        );

        this.saveState();

        this.setupColors();

        this.renderLayers();

        this.updateModeLayers();
        this.updateSelectionControls();

        // TOUCH
        this.canvas.addEventListener(
            'touchstart',
            e => {
                this.handleCanvasTap();
                this.start(e.touches[0]);
            }
        );

        this.canvas.addEventListener(
            'touchmove',
            e => {
                e.preventDefault();
                this.draw(e.touches[0]);
            }
        );

        this.canvas.addEventListener(
            'touchend',
            () => this.stop()
        );

        // MOUSE
        this.canvas.addEventListener(
            'mousedown',
            e => {
                this.handleCanvasTap();
                this.start(e);
            }
        );

        this.canvas.addEventListener(
            'mousemove',
            e => this.draw(e)
        );

        this.canvas.addEventListener(
            'mouseup',
            () => this.stop()
        );

        this.canvas.addEventListener(
            'mouseout',
            () => this.stop()
        );
    }

    resize(){

        const temp = document.createElement('canvas');

        temp.width = this.canvas.width;
        temp.height = this.canvas.height;

        const tempCtx = temp.getContext('2d');

        if(temp.width && temp.height){
            tempCtx.drawImage(this.canvas,0,0);
        }

        const dpr = window.devicePixelRatio || 1;
        const width = this.container.clientWidth;
        const height = this.container.clientHeight;

        this.canvas.width = width * dpr;
        this.canvas.height = height * dpr;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';

        this.shapeCanvas.width = width * dpr;
        this.shapeCanvas.height = height * dpr;
        this.shapeCanvas.style.width = width + 'px';
        this.shapeCanvas.style.height = height + 'px';

        this.ctx =
            this.canvas.getContext('2d');
        this.shapeCtx =
            this.shapeCanvas.getContext('2d');

        this.ctx.setTransform(dpr,0,0,dpr,0,0);
        this.shapeCtx.setTransform(dpr,0,0,dpr,0,0);

        if(temp.width && temp.height){
            this.ctx.drawImage(
                temp,
                0,
                0,
                temp.width,
                temp.height,
                0,
                0,
                width,
                height
            );
        }
    }

    getPos(e){

        const rect =
            this.canvas.getBoundingClientRect();

        return {
            x:e.clientX - rect.left,
            y:e.clientY - rect.top
        };
    }

    start(e){

        this.isDrawing = true;

        const pos = this.getPos(e);

        this.lastX = pos.x;
        this.lastY = pos.y;

        this.startX = pos.x;
        this.startY = pos.y;

        if(this.currentTool === 'fill'){
            this.fillArea(pos.x,pos.y);
            this.isDrawing = false;
            this.saveState();
            this.sendCanvasSnapshot();
            return;
        }

        if(this.currentTool === 'select'){
            const shape = this.findShapeAtPoint(pos.x,pos.y);
            if(shape){
                this.selectedShape = shape;
                const center = this.getObjectCenter(shape);
                this.dragOffset = {
                    x: pos.x - center.x,
                    y: pos.y - center.y
                };
                this.updateSelectionControls();
                this.redrawShapes();
            }
            return;
        }

        if(this.currentTool === 'line'){
            this.currentLine = {
                type: 'line',
                x1: pos.x,
                y1: pos.y,
                x2: pos.x,
                y2: pos.y,
                color: this.currentColor,
                opacity: this.opacity,
                blendMode: this.blendMode,
                lineWidth: Math.max(2, this.brushSize)
            };
            this.redrawShapes();
            return;
        }

        if(this.isShapeTool()){
            this.shapeSnapshot =
                this.ctx.getImageData(
                    0,
                    0,
                    this.canvas.width,
                    this.canvas.height
                );
        }
    }

    draw(e){

        if(!this.isDrawing) return;

        const pos = this.getPos(e);

        const x = pos.x;
        const y = pos.y;

        this.ctx.lineJoin = 'round';
        this.ctx.lineCap = 'round';

        this.ctx.lineWidth = this.brushSize;

        this.ctx.globalAlpha = this.opacity;

        if(this.currentTool === 'select'){
            if(!this.selectedShape) return;
            const newCenter = {
                x: x - this.dragOffset.x,
                y: y - this.dragOffset.y
            };
            this.moveObjectTo(this.selectedShape, newCenter.x, newCenter.y);
            this.redrawShapes();
            return;
        }

        if(this.currentTool === 'line'){
            if(!this.currentLine) return;
            this.currentLine.x2 = x;
            this.currentLine.y2 = y;
            this.redrawShapes();
            return;
        }

        if(this.isShapeTool()){

            this.lastX = x;
            this.lastY = y;

            if(this.shapeSnapshot){
                this.ctx.putImageData(
                    this.shapeSnapshot,
                    0,
                    0
                );
            }

            this.ctx.globalCompositeOperation =
                this.blendMode;

            this.ctx.strokeStyle =
                this.currentColor;

            this.drawShape(x,y);

            return;
        }

        if(this.currentTool === 'brush'){

            this.ctx.globalCompositeOperation =
                this.blendMode;

            this.ctx.strokeStyle =
                this.currentColor;

            this.ctx.beginPath();

            this.ctx.moveTo(
                this.lastX,
                this.lastY
            );

            this.ctx.lineTo(x,y);

            this.ctx.stroke();

            this.broadcastStroke(
                this.lastX,
                this.lastY,
                x,
                y
            );
        }

        else if(this.currentTool === 'eraser'){

    this.ctx.save();

    this.ctx.globalCompositeOperation = 'destination-out';

    this.ctx.strokeStyle = 'rgba(0,0,0,1)';

    this.ctx.lineWidth = this.brushSize;

    this.ctx.beginPath();

    this.ctx.moveTo(this.lastX, this.lastY);

    this.ctx.lineTo(x, y);

    this.ctx.stroke();

    this.ctx.restore();

    this.broadcastStroke(
        this.lastX,
        this.lastY,
        x,
        y
    );
}

        this.lastX = x;
        this.lastY = y;
    }

    stop(){

        if(!this.isDrawing) return;

        this.isDrawing = false;

        this.ctx.globalCompositeOperation =
            this.blendMode;

        this.ctx.globalAlpha =
            this.opacity;

        this.ctx.strokeStyle =
            this.currentColor;

        this.ctx.lineWidth =
            this.brushSize;

        if(this.currentTool === 'select'){
            if(this.selectedShape){
                this.showToast('Object moved');
                this.sendCanvasSnapshot();
            }
            return;
        }

        if(this.currentTool === 'line'){
            if(this.currentLine){
                this.lines.push(this.currentLine);
                this.selectedShape = this.currentLine;
                this.currentLine = null;
                this.currentTool = 'select';
                this.updateSelectionControls();
                this.redrawShapes();
                this.showToast('Line added and selected');
                this.sendCanvasSnapshot();
                return;
            }
        }

        if(this.isShapeTool()){

            if(this.shapeSnapshot){
                this.ctx.putImageData(
                    this.shapeSnapshot,
                    0,
                    0
                );
            }

            this.drawShape(
                this.lastX,
                this.lastY
            );

            this.shapeSnapshot = null;
        }

        this.saveState();
        this.sendCanvasSnapshot();
    }

    isShapeTool(){

        return [
            'rect',
            'circle'
        ].includes(this.currentTool);
    }

    drawShape(x,y){

        if(this.currentTool === 'rect'){

            this.ctx.strokeRect(
                this.startX,
                this.startY,
                x - this.startX,
                y - this.startY
            );
        }

        else if(this.currentTool === 'circle'){

            const radius = Math.sqrt(
                Math.pow(
                    x - this.startX,
                    2
                ) +
                Math.pow(
                    y - this.startY,
                    2
                )
            );

            this.ctx.beginPath();

            this.ctx.arc(
                this.startX,
                this.startY,
                radius,
                0,
                Math.PI * 2
            );

            this.ctx.stroke();
        }

        else if(this.currentTool === 'line'){

            this.ctx.beginPath();

            this.ctx.moveTo(
                this.startX,
                this.startY
            );

            this.ctx.lineTo(x,y);

            this.ctx.stroke();
        }
    }

    fillArea(cssX,cssY){

        const scaleX =
            this.canvas.width /
            this.canvas.clientWidth;

        const scaleY =
            this.canvas.height /
            this.canvas.clientHeight;

        const startX = Math.floor(cssX * scaleX);
        const startY = Math.floor(cssY * scaleY);

        if(
            startX < 0 ||
            startY < 0 ||
            startX >= this.canvas.width ||
            startY >= this.canvas.height
        ){
            return;
        }

        const imageData =
            this.ctx.getImageData(
                0,
                0,
                this.canvas.width,
                this.canvas.height
            );

        const data = imageData.data;
        const width = imageData.width;
        const height = imageData.height;
        const startIndex =
            (startY * width + startX) * 4;

        const target = [
            data[startIndex],
            data[startIndex + 1],
            data[startIndex + 2],
            data[startIndex + 3]
        ];

        const fill =
            this.hexToRgb(this.currentColor);

        const fillAlpha = this.opacity;
        const result = this.blendColor(
            target,
            fill,
            fillAlpha
        );

        if(
            this.colorMatches(
                target,
                result,
                0
            )
        ){
            return;
        }

        const tolerance = 24;
        const stack = [[startX,startY]];
        const visited =
            new Uint8Array(width * height);

        while(stack.length){

            const point = stack.pop();
            const x = point[0];
            const y = point[1];

            if(
                x < 0 ||
                y < 0 ||
                x >= width ||
                y >= height
            ){
                continue;
            }

            const pixelIndex = y * width + x;

            if(visited[pixelIndex]){
                continue;
            }

            visited[pixelIndex] = 1;

            const index = pixelIndex * 4;
            const color = [
                data[index],
                data[index + 1],
                data[index + 2],
                data[index + 3]
            ];

            if(
                !this.colorMatches(
                    color,
                    target,
                    tolerance
                )
            ){
                continue;
            }

            data[index] = result[0];
            data[index + 1] = result[1];
            data[index + 2] = result[2];
            data[index + 3] = result[3];

            stack.push([x + 1,y]);
            stack.push([x - 1,y]);
            stack.push([x,y + 1]);
            stack.push([x,y - 1]);
        }

        this.ctx.putImageData(
            imageData,
            0,
            0
        );
    }

    hexToRgb(hex){

        const value =
            hex.replace('#','');

        return [
            parseInt(value.slice(0,2),16),
            parseInt(value.slice(2,4),16),
            parseInt(value.slice(4,6),16),
            255
        ];
    }

    blendColor(target,fill,alpha){

        const inverse = 1 - alpha;

        return [
            Math.round(fill[0] * alpha + target[0] * inverse),
            Math.round(fill[1] * alpha + target[1] * inverse),
            Math.round(fill[2] * alpha + target[2] * inverse),
            255
        ];
    }

    colorMatches(a,b,tolerance){

        return (
            Math.abs(a[0] - b[0]) <= tolerance &&
            Math.abs(a[1] - b[1]) <= tolerance &&
            Math.abs(a[2] - b[2]) <= tolerance &&
            Math.abs(a[3] - b[3]) <= tolerance
        );
    }

    togglePanel(panelId){

        this.restoreChrome();

        const panels = [
            'panel-color',
            'panel-tools',
            'panel-shapes',
            'panel-layers'
        ];

        panels.forEach(id => {

            const el =
                document.getElementById(id);

            if(!el) return;

            el.classList.toggle(
                'active',
                id === `panel-${panelId}`
            );
            });
    }

    closePanels(){

        document
            .querySelectorAll('.panel')
            .forEach(panel => {
                panel.classList.remove('active');
            });

        this.minimizeChrome();
    }

    minimizeChrome(){

        document.body.classList.add(
            'chrome-minimized'
        );
    }

    restoreChrome(){

        document.body.classList.remove(
            'chrome-minimized'
        );
    }

    handleCanvasTap(){

        const now = Date.now();

        if(now - this.lastCanvasTap < 300){
            this.restoreChrome();
        }

        this.lastCanvasTap = now;
    }

    setBrushSize(val){

        this.brushSize = Number(val);

        document.getElementById(
            'sizeLabel'
        ).textContent =
            `${this.brushSize}px`;
    }

    setOpacity(val){

        const v = Number(val);

        this.opacity = v / 100;

        document.getElementById(
            'opacityLabel'
        ).textContent =
            `${v}%`;
    }

    setBlendMode(mode){

        this.blendMode = mode;
    }

    setShapeSize(val){
        const size = Number(val);
        const label = document.getElementById('shapeSizeLabel');
        const slider = document.getElementById('shapeSizeSlider');

        this.shapeSize = size;

        if(this.selectedShape && this.selectedShape.type !== 'line'){
            this.selectedShape.size = size;
            label.textContent = `${size}px`;
            this.redrawShapes();
            this.sendCanvasSnapshot();
            return;
        }

        slider.value = size;
        label.textContent = `${size}px`;
    }

    setSelectedOpacity(val){
        const opacity = Number(val) / 100;
        const label = document.getElementById('selectedOpacityLabel');
        const slider = document.getElementById('selectedOpacitySlider');

        if(!this.selectedShape){
            slider.value = val;
            label.textContent = 'No object selected';
            return;
        }

        this.selectedShape.opacity = opacity;
        label.textContent = `${val}%`;
        this.redrawShapes();
        this.sendCanvasSnapshot();
    }

    updateSelectionControls(){
        const sizeLabel = document.getElementById('shapeSizeLabel');
        const sizeSlider = document.getElementById('shapeSizeSlider');
        const opacityLabel = document.getElementById('selectedOpacityLabel');
        const opacitySlider = document.getElementById('selectedOpacitySlider');

        if(this.selectedShape){
            opacitySlider.disabled = false;
            opacitySlider.value = Math.round(this.selectedShape.opacity * 100);
            opacityLabel.textContent = `${Math.round(this.selectedShape.opacity * 100)}%`;

            if(this.selectedShape.type === 'line'){
                sizeSlider.disabled = true;
                sizeLabel.textContent = 'Line selected';
            }
            else{
                sizeSlider.disabled = false;
                sizeSlider.value = this.selectedShape.size;
                sizeLabel.textContent = `${Math.round(this.selectedShape.size)}px`;
            }
        }
        else{
            opacitySlider.disabled = true;
            opacitySlider.value = 100;
            opacityLabel.textContent = 'No object selected';

            sizeSlider.disabled = false;
            sizeSlider.value = this.shapeSize;
            sizeLabel.textContent = `${Math.round(this.shapeSize)}px`;
        }
    }

    getObjectCenter(obj){
        if(obj.type === 'line'){
            return {
                x: (obj.x1 + obj.x2) / 2,
                y: (obj.y1 + obj.y2) / 2
            };
        }

        return {x: obj.x, y: obj.y};
    }

    moveObjectTo(obj, x, y){
        if(obj.type === 'line'){
            const center = this.getObjectCenter(obj);
            const dx = x - center.x;
            const dy = y - center.y;
            obj.x1 += dx;
            obj.x2 += dx;
            obj.y1 += dy;
            obj.y2 += dy;
            return;
        }

        obj.x = x;
        obj.y = y;
    }

    findShapeAtPoint(x,y){
        for(let i = this.lines.length - 1; i >= 0; i--){
            if(this.isPointInShape(this.lines[i], x, y)){
                return this.lines[i];
            }
        }

        for(let i = this.shapes.length - 1; i >= 0; i--){
            if(this.isPointInShape(this.shapes[i], x, y)){
                return this.shapes[i];
            }
        }

        return null;
    }

    isPointInShape(shape,x,y){
        if(shape.type === 'line'){
            const dx = shape.x2 - shape.x1;
            const dy = shape.y2 - shape.y1;
            const len2 = dx * dx + dy * dy;

            if(len2 === 0){
                const dist = Math.hypot(x - shape.x1, y - shape.y1);
                return dist <= shape.lineWidth / 2 + 6;
            }

            let t = ((x - shape.x1) * dx + (y - shape.y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const closestX = shape.x1 + dx * t;
            const closestY = shape.y1 + dy * t;
            const dist = Math.hypot(x - closestX, y - closestY);
            return dist <= shape.lineWidth / 2 + 6;
        }

        const half = shape.size * 0.55;
        return (
            x >= shape.x - half &&
            x <= shape.x + half &&
            y >= shape.y - half &&
            y <= shape.y + half
        );
    }

    async setMode(mode){

        if(mode === 'camera'){

            if(this.isStartingCamera) return;

            this.isStartingCamera = true;
            this.setCameraButtonBusy(true);

            const cameraReady =
                await this.startCameraMode();

            this.isStartingCamera = false;
            this.setCameraButtonBusy(false);

            if(!cameraReady){
                this.mode = 'draw';
                this.updateModeButtons();
                this.updateModeLayers();
                return;
            }

            this.mode = 'camera';
            this.updateModeButtons();
            this.updateModeLayers();
            this.openImageImporter();
            this.minimizeChrome();
            return;
        }

        this.mode = 'draw';
        this.stopCameraMode();
        this.updateModeButtons();
        this.updateModeLayers();
    }

    setCameraButtonBusy(isBusy){

        const button =
            document.getElementById('cameraModeBtn');

        if(!button) return;

        button.disabled = isBusy;

        if(isBusy){
            button.setAttribute(
                'aria-busy',
                'true'
            );
        }

        else{
            button.removeAttribute(
                'aria-busy'
            );
        }
    }

    updateModeButtons(){

        const drawModeBtn =
            document.getElementById('drawModeBtn');

        const cameraModeBtn =
            document.getElementById('cameraModeBtn');

        if(drawModeBtn){
            drawModeBtn.classList.toggle(
                'active',
                this.mode === 'draw'
            );
        }

        if(cameraModeBtn){
            cameraModeBtn.classList.toggle(
                'active',
                this.mode === 'camera'
            );
        }
    }

    updateModeLayers(){

        const isCameraMode =
            this.mode === 'camera';

        document.getElementById('canvas-bg')
            .style.display = isCameraMode
            ? 'none'
            : 'block';

        this.canvas.style.backgroundColor =
            isCameraMode
            ? 'transparent'
            : 'white';

        this.cameraFeed.style.display =
            isCameraMode &&
            this.cameraStream
            ? 'block'
            : 'none';

        this.traceImage.style.display =
            isCameraMode &&
            this.traceImage.getAttribute('src')
            ? 'block'
            : 'none';

        this.guideControls.classList.toggle(
            'active',
            isCameraMode
        );
    }

    async getStoredCameraPermission(){

        if(
            !navigator.permissions ||
            !navigator.permissions.query
        ){
            return 'unknown';
        }

        try{
            const status =
                await navigator.permissions.query({
                    name:'camera'
                });

            return status.state;
        }

        catch(err){
            return 'unknown';
        }
    }

    async startCameraMode(){

        if(this.cameraStream){
            this.updateModeLayers();
            return true;
        }

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){
            const message = window.isSecureContext
                ? 'Camera API Not Available'
                : 'Use HTTPS to Allow Camera';

            this.showToast(
                message,
                3600
            );

            return false;
        }

        try{

            const permissionState =
                await this.getStoredCameraPermission();

            if(permissionState === 'denied'){
                this.showCameraHelp(
                    'Camera permission is denied. Open browser site settings, allow Camera for this page, then tap Retry.'
                );

                return false;
            }

            this.hideCameraHelp();
            this.showToast('Allow Camera Access');

            this.cameraStream =
                await this.requestCameraStream();

            this.cameraFeed.srcObject =
                this.cameraStream;

            await this.cameraFeed.play();

            this.updateModeLayers();

            this.showToast('Camera Ready');
            this.hideCameraHelp();

            return true;
        }

        catch(err){

            console.warn('Camera start failed:',err);

            if(this.cameraStream){
                this.cameraStream
                    .getTracks()
                    .forEach(track => track.stop());
            }

            this.cameraStream = null;
            this.cameraFeed.srcObject = null;

            this.mode = 'draw';

            const drawModeBtn =
                document.getElementById('drawModeBtn');

            const cameraModeBtn =
                document.getElementById('cameraModeBtn');

            if(drawModeBtn){
                drawModeBtn.classList.add('active');
            }

            if(cameraModeBtn){
                cameraModeBtn.classList.remove('active');
            }

            this.showToast(
                this.getCameraErrorMessage(err),
                3600
            );

            this.showCameraHelp(
                this.getCameraHelpMessage(err)
            );

            this.updateModeLayers();

            return false;
        }
    }

    async requestCameraStream(){

        try{
            return await navigator.mediaDevices
                .getUserMedia({
                    video:{
                        facingMode:{
                            ideal:'environment'
                        }
                    },
                    audio:false
                });
        }

        catch(err){

            if(
                err.name === 'OverconstrainedError' ||
                err.name === 'NotFoundError'
            ){
                return navigator.mediaDevices
                    .getUserMedia({
                        video:true,
                        audio:false
                    });
            }

            throw err;
        }
    }

    getCameraErrorMessage(err){

        if(!window.isSecureContext){
            return 'Use HTTPS to Allow Camera';
        }

        if(!err || !err.name){
            return 'Camera Could Not Start';
        }

        const messages = {
            NotAllowedError:'Camera Permission Denied. Enable it in site settings.',
            SecurityError:'Camera Blocked by Security',
            NotFoundError:'No Camera Found',
            NotReadableError:'Camera Busy or Unavailable',
            AbortError:'Camera Start Cancelled',
            OverconstrainedError:'Camera Mode Not Supported'
        };

        return messages[err.name] ||
            `Camera Error: ${err.name}`;
    }

    getCameraHelpMessage(err){

        if(!window.isSecureContext){
            return 'Camera needs HTTPS. Upload this file to HTTPS hosting or open it through an HTTPS tunnel, then tap Retry.';
        }

        if(!err || !err.name){
            return 'Camera could not start. Check browser camera settings, then tap Retry.';
        }

        const messages = {
            NotAllowedError:'Permission was denied or already blocked. Open site settings for this page, change Camera to Allow, then tap Retry.',
            SecurityError:'The browser blocked camera for security. Use HTTPS and allow Camera in site settings.',
            NotFoundError:'No camera was found. Check that your phone/browser has camera access.',
            NotReadableError:'The camera is being used by another app or browser tab. Close it, then tap Retry.',
            AbortError:'Camera startup was interrupted. Tap Retry.',
            OverconstrainedError:'The back camera request failed. Tap Retry to use any available camera.'
        };

        return messages[err.name] ||
            `Camera failed with ${err.name}. Check browser permissions, then tap Retry.`;
    }

    showCameraHelp(message){

        this.cameraHelpText.textContent = message;
        this.cameraHelp.classList.add('active');
    }

    hideCameraHelp(){

        this.cameraHelp.classList.remove('active');
    }

    stopCameraMode(){

        if(this.cameraStream){
            this.cameraStream
                .getTracks()
                .forEach(track => track.stop());
        }

        this.cameraStream = null;

        this.cameraFeed.pause();

        this.cameraFeed.srcObject = null;

        this.hideCameraHelp();
        this.updateModeLayers();
    }

    insertShape(shapeName){
        const x = this.canvas.clientWidth / 2;
        const y = this.canvas.clientHeight / 2;
        const size = Math.min(
            this.canvas.clientWidth,
            this.canvas.clientHeight
        ) * 0.25;

        const shape = {
            type: shapeName,
            x,
            y,
            size: this.shapeSize,
            color: this.currentColor,
            opacity: this.opacity,
            blendMode: this.blendMode,
            lineWidth: Math.max(2, this.brushSize)
        };

        this.shapes.push(shape);
        this.selectedShape = shape;
        this.currentTool = 'select';
        this.updateSelectionControls();
        this.redrawShapes();
        this.showToast(
            `${shapeName[0].toUpperCase() + shapeName.slice(1)} added and selected`
        );
    }

    redrawShapes(){
        if(!this.shapeCtx) return;

        this.shapeCtx.clearRect(
            0,
            0,
            this.canvas.clientWidth,
            this.canvas.clientHeight
        );

        this.lines.forEach(line => {
            this.shapeCtx.save();
            this.shapeCtx.globalAlpha = line.opacity;
            this.shapeCtx.globalCompositeOperation = line.blendMode;
            this.shapeCtx.strokeStyle = line.color;
            this.shapeCtx.lineWidth = line.lineWidth;
            this.drawLineObject(line);
            this.shapeCtx.restore();

            if(this.selectedShape === line){
                const minX = Math.min(line.x1, line.x2);
                const maxX = Math.max(line.x1, line.x2);
                const minY = Math.min(line.y1, line.y2);
                const maxY = Math.max(line.y1, line.y2);
                const padding = 8;

                this.shapeCtx.save();
                this.shapeCtx.strokeStyle = 'rgba(0,188,212,0.9)';
                this.shapeCtx.lineWidth = 2;
                this.shapeCtx.setLineDash([6,4]);
                this.shapeCtx.strokeRect(
                    minX - padding,
                    minY - padding,
                    (maxX - minX) + padding * 2,
                    (maxY - minY) + padding * 2
                );
                this.shapeCtx.restore();
            }
        });

        this.shapes.forEach(shape => {
            this.shapeCtx.save();
            this.shapeCtx.globalAlpha = shape.opacity;
            this.shapeCtx.globalCompositeOperation = shape.blendMode;
            this.shapeCtx.strokeStyle = shape.color;
            this.shapeCtx.fillStyle = shape.color;
            this.shapeCtx.lineWidth = shape.lineWidth;

            if(shape.type === 'heart'){
                this.drawHeart(shape.x, shape.y, shape.size);
            }
            else if(shape.type === 'rose'){
                this.drawRose(shape.x, shape.y, shape.size);
            }
            else if(shape.type === 'star'){
                this.drawStar(shape.x, shape.y, shape.size);
            }
            else if(shape.type === 'leaf'){
                this.drawLeaf(shape.x, shape.y, shape.size);
            }

            this.shapeCtx.restore();

            if(this.selectedShape === shape){
                const half = shape.size * 0.55;
                this.shapeCtx.save();
                this.shapeCtx.strokeStyle = 'rgba(0,188,212,0.9)';
                this.shapeCtx.lineWidth = 2;
                this.shapeCtx.setLineDash([6,4]);
                this.shapeCtx.strokeRect(
                    shape.x - half,
                    shape.y - half,
                    half * 2,
                    half * 2
                );
                this.shapeCtx.restore();
            }
        });

        if(this.currentLine){
            this.shapeCtx.save();
            this.shapeCtx.globalAlpha = this.currentLine.opacity;
            this.shapeCtx.globalCompositeOperation = this.currentLine.blendMode;
            this.shapeCtx.strokeStyle = this.currentLine.color;
            this.shapeCtx.lineWidth = this.currentLine.lineWidth;
            this.shapeCtx.setLineDash([6,4]);
            this.drawLineObject(this.currentLine);
            this.shapeCtx.restore();
        }
    }

    findShapeAtPoint(x,y){
        for(let i = this.lines.length - 1; i >= 0; i--){
            if(this.isPointInShape(this.lines[i], x, y)){
                return this.lines[i];
            }
        }

        for(let i = this.shapes.length - 1; i >= 0; i--){
            if(this.isPointInShape(this.shapes[i], x, y)){
                return this.shapes[i];
            }
        }

        return null;
    }

    isPointInShape(shape,x,y){
        if(shape.type === 'line'){
            const dx = shape.x2 - shape.x1;
            const dy = shape.y2 - shape.y1;
            const len2 = dx * dx + dy * dy;

            if(len2 === 0){
                const dist = Math.hypot(x - shape.x1, y - shape.y1);
                return dist <= shape.lineWidth / 2 + 6;
            }

            let t = ((x - shape.x1) * dx + (y - shape.y1) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const closestX = shape.x1 + dx * t;
            const closestY = shape.y1 + dy * t;
            const dist = Math.hypot(x - closestX, y - closestY);
            return dist <= shape.lineWidth / 2 + 6;
        }

        const half = shape.size * 0.55;
        return (
            x >= shape.x - half &&
            x <= shape.x + half &&
            y >= shape.y - half &&
            y <= shape.y + half
        );
    }

    drawLineObject(line){
        this.shapeCtx.beginPath();
        this.shapeCtx.moveTo(line.x1, line.y1);
        this.shapeCtx.lineTo(line.x2, line.y2);
        this.shapeCtx.stroke();
    }

    drawHeart(x,y,size){
        const ctx = this.shapeCtx;
        ctx.beginPath();
        ctx.moveTo(x, y + size * 0.25);
        ctx.bezierCurveTo(
            x + size,
            y - size * 0.35,
            x + size * 0.5,
            y - size,
            x,
            y - size * 0.25
        );
        ctx.bezierCurveTo(
            x - size * 0.5,
            y - size,
            x - size,
            y - size * 0.35,
            x,
            y + size * 0.25
        );
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    drawRose(x,y,size){
        const ctx = this.shapeCtx;
        const centerRadius = size * 0.18;
        ctx.beginPath();
        ctx.arc(x, y, centerRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + centerRadius, y);
        ctx.bezierCurveTo(
            x + size * 0.35,
            y - size * 0.08,
            x + size * 0.32,
            y + size * 0.18,
            x + size * 0.05,
            y + size * 0.25
        );
        ctx.moveTo(x - centerRadius, y);
        ctx.bezierCurveTo(
            x - size * 0.35,
            y - size * 0.08,
            x - size * 0.32,
            y + size * 0.18,
            x - size * 0.05,
            y + size * 0.25
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y + centerRadius * 0.6);
        ctx.lineTo(x, y + size * 0.6);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y + size * 0.4);
        ctx.bezierCurveTo(
            x + size * 0.1,
            y + size * 0.65,
            x + size * 0.25,
            y + size * 0.78,
            x + size * 0.18,
            y + size * 0.95
        );
        ctx.moveTo(x, y + size * 0.4);
        ctx.bezierCurveTo(
            x - size * 0.1,
            y + size * 0.65,
            x - size * 0.25,
            y + size * 0.78,
            x - size * 0.18,
            y + size * 0.95
        );
        ctx.stroke();
    }

    drawStar(x,y,size){
        const ctx = this.shapeCtx;
        const outer = size * 0.5;
        const inner = outer * 0.45;
        const step = Math.PI / 5;
        ctx.beginPath();
        for(let i = 0; i < 10; i++){
            const radius = i % 2 === 0 ? outer : inner;
            const angle = i * step - Math.PI / 2;
            const px = x + Math.cos(angle) * radius;
            const py = y + Math.sin(angle) * radius;
            if(i === 0){
                ctx.moveTo(px,py);
            } else {
                ctx.lineTo(px,py);
            }
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    drawLeaf(x,y,size){
        const ctx = this.shapeCtx;
        ctx.beginPath();
        ctx.moveTo(x, y - size * 0.3);
        ctx.quadraticCurveTo(
            x + size * 0.4,
            y,
            x,
            y + size * 0.4
        );
        ctx.quadraticCurveTo(
            x - size * 0.4,
            y,
            x,
            y - size * 0.3
        );
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - size * 0.24);
        ctx.lineTo(x, y + size * 0.36);
        ctx.stroke();
    }

    clearCanvas(){

        this.ctx.save();

        this.ctx.globalCompositeOperation =
            'source-over';

        this.ctx.clearRect(
            0,
            0,
            this.canvas.width,
            this.canvas.height
        );

        this.ctx.restore();

        if(this.shapeCtx){
            this.shapeCtx.clearRect(
                0,
                0,
                this.shapeCanvas.width,
                this.shapeCanvas.height
            );
        }

        this.shapes = [];
        this.selectedShape = null;
        this.updateSelectionControls();

        this.saveState();
        this.sendCanvasSnapshot();

        this.showToast('Canvas Cleared');
    }

    addLayer(){

        const newId =
            Math.max(
                ...this.layers.map(l => l.id)
            ) + 1;

        this.layers.push({
            id:newId,
            name:`Layer ${this.layers.length}`
        });

        this.activeLayerId = newId;

        this.renderLayers();

        this.showToast('Layer Added');
    }

    renderLayers(){

        const list =
            document.getElementById('layerList');

        list.innerHTML = '';

        this.layers.forEach(layer => {

            const item =
                document.createElement('div');

            item.className =
                `layer-item ${
                    layer.id === this.activeLayerId
                    ? 'active'
                    : ''
                }`;

            const left =
                document.createElement('div');

            left.textContent = layer.name;

            const right =
                document.createElement('div');

            right.className =
                'layer-actions';

            const del =
                document.createElement('i');

            del.className =
                'fas fa-trash';

            del.style.visibility =
                layer.id === 1
                ? 'hidden'
                : 'visible';

            del.addEventListener(
                'click',
                ev => {

                    ev.stopPropagation();

                    if(layer.id === 1) return;

                    this.layers =
                        this.layers.filter(
                            l => l.id !== layer.id
                        );

                    if(
                        this.activeLayerId
                        === layer.id
                    ){
                        this.activeLayerId =
                            this.layers[0].id;
                    }

                    this.renderLayers();

                    this.showToast(
                        'Layer Deleted'
                    );
                }
            );

            item.addEventListener(
                'click',
                () => {

                    this.activeLayerId =
                        layer.id;

                    this.renderLayers();
                }
            );

            right.appendChild(del);

            item.appendChild(left);

            item.appendChild(right);

            list.appendChild(item);
        });
    }

    toggleCollabPanel(){

        this.collabPanel.classList.toggle('active');
    }

    openCollabPanel(){

        this.collabPanel.classList.add('active');
        this.collabFloat.classList.remove('active');
    }

    collapseCollabPanel(){

        this.collabPanel.classList.remove('active');

        if(this.connections.length){
            this.collabFloat.classList.add('active');
        }
    }

    getPeerIdFromCode(code){

        return `mobidraw-${code.toLowerCase()}`;
    }

    makeShareCode(){

        return Math.random()
            .toString(36)
            .slice(2,8)
            .toUpperCase();
    }

    ensurePeerLibrary(){

        return new Promise((resolve,reject) => {

            if(window.Peer){
                resolve();
                return;
            }

            const existing =
                document.getElementById('peerjsScript');

            if(existing){
                existing.addEventListener('load',resolve);
                existing.addEventListener('error',reject);
                return;
            }

            const script =
                document.createElement('script');

            script.id = 'peerjsScript';
            script.src =
                'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
            script.onload = resolve;
            script.onerror = reject;

            document.head.appendChild(script);
        });
    }

    async createShareCode(){

        try{
            await this.ensurePeerLibrary();
        }

        catch(err){
            this.setCollabStatus(
                'Peer library failed to load. Check internet.'
            );
            return;
        }

        this.disconnectCollab(false);

        this.shareCode = this.makeShareCode();

        this.peer = new Peer(
            this.getPeerIdFromCode(this.shareCode)
        );

        this.peer.on('open',() => {
            this.collabCodeText.textContent =
                this.shareCode;
            this.collabCodeBox.classList.add('active');
            this.setCollabStatus(
                'Share this code. Waiting for another user...'
            );
        });

        this.peer.on('connection',conn => {
            this.registerConnection(conn);
        });

        this.peer.on('error',err => {
            this.setCollabStatus(
                this.getCollabErrorMessage(err)
            );
        });
    }

    async joinShareCode(){

        const code =
            this.joinCodeInput.value
                .trim()
                .toUpperCase();

        if(!code){
            this.setCollabStatus('Enter a share code.');
            return;
        }

        try{
            await this.ensurePeerLibrary();
        }

        catch(err){
            this.setCollabStatus(
                'Peer library failed to load. Check internet.'
            );
            return;
        }

        this.disconnectCollab(false);

        this.peer = new Peer();

        this.peer.on('open',() => {
            const conn = this.peer.connect(
                this.getPeerIdFromCode(code),
                {
                    reliable:true
                }
            );

            this.registerConnection(conn);
            this.setCollabStatus('Joining canvas...');
        });

        this.peer.on('error',err => {
            this.setCollabStatus(
                this.getCollabErrorMessage(err)
            );
        });
    }

    registerConnection(conn){

        this.connections.push(conn);

        conn.on('open',() => {
            this.setCollabStatus('Connected. Canvas is shared.');
            this.showToast('Canvas Shared');
            this.sendCanvasSnapshot(conn);
            this.collapseCollabPanel();
        });

        conn.on('data',data => {
            this.handleCollabData(data,conn);
        });

        conn.on('close',() => {
            this.connections =
                this.connections.filter(c => c !== conn);
            this.setCollabStatus('User disconnected.');

            if(!this.connections.length){
                this.collabFloat.classList.remove('active');
            }
        });

        conn.on('error',() => {
            this.setCollabStatus('Connection failed.');
        });
    }

    disconnectCollab(showMessage = true){

        this.connections.forEach(conn => conn.close());
        this.connections = [];

        if(this.peer){
            this.peer.destroy();
        }

        this.peer = null;
        this.shareCode = '';
        this.collabCodeText.textContent = '';
        this.collabCodeBox.classList.remove('active');
        this.collabFloat.classList.remove('active');

        if(showMessage){
            this.setCollabStatus('Sharing stopped.');
        }
    }

    copyCollabCode(){

        if(!this.shareCode) return;

        if(navigator.clipboard){
            navigator.clipboard.writeText(this.shareCode);
        }

        this.showToast('Code Copied');
    }

    setCollabStatus(message){

        this.collabStatus.textContent = message;
    }

    getCollabErrorMessage(err){

        if(!err || !err.type){
            return 'Sharing failed. Try again.';
        }

        const messages = {
            unavailable:'Code already in use. Create another code.',
            'peer-unavailable':'No canvas found for this code.',
            network:'Network error. Check internet.',
            'server-error':'Share server error. Try again.'
        };

        return messages[err.type] ||
            `Sharing error: ${err.type}`;
    }

    broadcast(data,excludeConn = null){

        this.connections.forEach(conn => {
            if(
                conn !== excludeConn &&
                conn.open
            ){
                conn.send(data);
            }
        });
    }

    normalizePoint(x,y){

        return {
            x:x / this.canvas.clientWidth,
            y:y / this.canvas.clientHeight
        };
    }

    denormalizePoint(point){

        return {
            x:point.x * this.canvas.clientWidth,
            y:point.y * this.canvas.clientHeight
        };
    }

    broadcastStroke(x1,y1,x2,y2){

        if(
            this.isApplyingRemote ||
            !this.connections.length ||
            !['brush','eraser'].includes(this.currentTool)
        ){
            return;
        }

        this.broadcast({
            type:'stroke',
            from:this.clientId,
            tool:this.currentTool,
            color:this.currentColor,
            size:this.brushSize,
            opacity:this.opacity,
            blendMode:this.blendMode,
            start:this.normalizePoint(x1,y1),
            end:this.normalizePoint(x2,y2)
        });
    }

    getCombinedCanvasDataURL(){
        const temp = document.createElement('canvas');
        temp.width = this.canvas.width;
        temp.height = this.canvas.height;
        const ctx = temp.getContext('2d');
        ctx.drawImage(this.canvas, 0, 0);
        ctx.drawImage(this.shapeCanvas, 0, 0);
        return temp.toDataURL('image/png');
    }

    sendCanvasSnapshot(conn = null){

        if(
            this.isApplyingRemote ||
            (!conn && !this.connections.length)
        ){
            return;
        }

        const data = {
            type:'snapshot',
            from:this.clientId,
            image:this.getCombinedCanvasDataURL()
        };

        if(conn && conn.open){
            conn.send(data);
            return;
        }

        this.broadcast(data);
    }

    handleCollabData(data,originConn = null){

        if(
            !data ||
            data.from === this.clientId
        ){
            return;
        }

        if(data.type === 'stroke'){
            this.applyRemoteStroke(data);
        }

        else if(data.type === 'snapshot'){
            this.applyRemoteSnapshot(data.image);
        }

        if(this.shareCode){
            this.broadcast(data,originConn);
        }
    }

    applyRemoteStroke(data){

        const start =
            this.denormalizePoint(data.start);

        const end =
            this.denormalizePoint(data.end);

        this.isApplyingRemote = true;

        this.ctx.save();
        this.ctx.lineJoin = 'round';
        this.ctx.lineCap = 'round';
        this.ctx.lineWidth = data.size;
        this.ctx.globalAlpha = data.opacity;

        if(data.tool === 'eraser'){
            this.ctx.globalCompositeOperation =
                'destination-out';
            this.ctx.strokeStyle = 'rgba(0,0,0,1)';
        }

        else{
            this.ctx.globalCompositeOperation =
                data.blendMode || 'source-over';
            this.ctx.strokeStyle = data.color;
        }

        this.ctx.beginPath();
        this.ctx.moveTo(start.x,start.y);
        this.ctx.lineTo(end.x,end.y);
        this.ctx.stroke();
        this.ctx.restore();

        this.isApplyingRemote = false;
    }

    applyRemoteSnapshot(imageSrc){

        const img = new Image();

        img.onload = () => {
            this.isApplyingRemote = true;
            this.ctx.save();
            this.ctx.globalCompositeOperation =
                'source-over';
            this.ctx.globalAlpha = 1;
            this.ctx.clearRect(
                0,
                0,
                this.canvas.width,
                this.canvas.height
            );
            this.ctx.drawImage(
                img,
                0,
                0,
                this.canvas.clientWidth,
                this.canvas.clientHeight
            );
            this.ctx.restore();
            this.saveState();
            this.isApplyingRemote = false;
        };

        img.src = imageSrc;
    }

    saveState(){

        if(
            this.historyStep
            <
            this.history.length - 1
        ){
            this.history =
                this.history.slice(
                    0,
                    this.historyStep + 1
                );
        }

        const imageData =
            this.ctx.getImageData(
                0,
                0,
                this.canvas.width,
                this.canvas.height
            );

        this.history.push(imageData);

        if(
            this.history.length
            >
            this.maxHistory
        ){
            this.history.shift();
        }

        this.historyStep =
            this.history.length - 1;
    }

    restoreFromHistory(index){

        const data = this.history[index];

        if(!data) return;

        this.ctx.putImageData(data,0,0);
    }

    undo(){

        if(this.historyStep <= 0) return;

        this.historyStep--;

        this.restoreFromHistory(
            this.historyStep
        );

        this.sendCanvasSnapshot();
    }

    redo(){

        if(
            this.historyStep
            >=
            this.history.length - 1
        ) return;

        this.historyStep++;

        this.restoreFromHistory(
            this.historyStep
        );

        this.sendCanvasSnapshot();
    }

    exportPNG(){

        const link =
            document.createElement('a');

        link.download = 'mobidraw.png';

        link.href =
            this.getCombinedCanvasDataURL();

        link.click();

        this.showToast('PNG Downloaded');
    }

    saveProject(){

        try{

            localStorage.setItem(
                'mobidraw_project',
                this.getCombinedCanvasDataURL()
            );

            this.showToast(
                'Project Saved'
            );
        }

        catch(err){

            this.showToast(
                'Save Failed'
            );
        }
    }

    showToast(msg,duration = 1200){

        const toast =
            document.getElementById('toast');

        toast.textContent = msg;

        toast.classList.add('show');

        clearTimeout(this.toastTimer);

        this.toastTimer =
            setTimeout(
                () => toast.classList.remove('show'),
                duration
            );
    }
}

window.app = new MobiDraw();

</script>
